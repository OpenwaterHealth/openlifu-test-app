name: Build & Release

on:
  workflow_dispatch:
    inputs:
      context:
        description: "Operator-kiosk context to build (e.g. 'vet'). Leave blank for the default TestApp release."
        required: false
        type: string
        default: ""
  push:
    branches: [main, next]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python + dependencies (PyPI) ─────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install project + build tooling. openlifu-sdk and all
          # other runtime deps are pinned in pyproject.toml and pulled
          # from PyPI -- no special bootstrap step needed.
          pip install ".[dev]"

      # ── build ────────────────────────────────────────────────────
      - name: Stamp version from git tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Strip leading 'v' only; -rc.x suffix is preserved as-is
            VER="${TAG#v}"
          else
            VER=$(git describe --tags --dirty --always --long 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "Stamping version: $VER"
          # Update _FALLBACK_VERSION in version.py so the frozen exe uses it
          sed -i "s/^_FALLBACK_VERSION = .*/_FALLBACK_VERSION = \"${VER}\"/" version.py

      - name: Build with PyInstaller
        shell: bash
        env:
          # Optional operator-kiosk context. Set via workflow_dispatch
          # input only; tag-pushed releases leave this empty so the
          # default vendor-neutral TestApp.exe / TestApp_console.exe
          # are the only artifacts shipped.
          OPENLIFU_CONTEXT: ${{ github.event.inputs.context }}
        run: |
          if [ -n "${OPENLIFU_CONTEXT}" ]; then
            echo "Building with operator-kiosk context: ${OPENLIFU_CONTEXT}"
          else
            echo "Building default release (no context-specific kiosk EXE)"
          fi
          python -m PyInstaller -y OpenLIFU-TestApp.spec

      # ── package ──────────────────────────────────────────────────
      - name: Determine version tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --dirty --always 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          CONTEXT="${{ github.event.inputs.context }}"
          if [ -n "$CONTEXT" ]; then
            echo "ARTIFACT_NAME=OpenLifu-TestApp-${CONTEXT}-${TAG}" >> "$GITHUB_OUTPUT"
            echo "ARTIFACT_ZIP=OpenLifu-TestApp-${CONTEXT}-${TAG}.zip" >> "$GITHUB_OUTPUT"
          else
            echo "ARTIFACT_NAME=OpenLifu-TestApp-${TAG}" >> "$GITHUB_OUTPUT"
            echo "ARTIFACT_ZIP=OpenLifu-TestApp-${TAG}.zip" >> "$GITHUB_OUTPUT"
          fi

          # pre-release flag
          if [[ "$TAG" == *-rc.* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice ::Version tag resolved to: ${TAG}"

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "${{ steps.meta.outputs.ARTIFACT_ZIP }}"

      # ── always upload workflow artifact ──────────────────────────
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
          path: ${{ steps.meta.outputs.ARTIFACT_ZIP }}

      # ── build release notes ───────────────────────────────────────
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        run: |
          : > notes.md

          if [[ "${{ steps.meta.outputs.PRERELEASE }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          # Commits since previous tag (bullet list)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since ${PREV_TAG}" >> notes.md
            echo "" >> notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> notes.md
            echo "" >> notes.md
            echo "" >> notes.md
            echo "**Full diff:** [\`${PREV_TAG}...${{ steps.meta.outputs.TAG }}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.meta.outputs.TAG }})" >> notes.md
          else
            echo "### Commits" >> notes.md
            echo "" >> notes.md
            git log --pretty=format:"- %s (%h)" -20 >> notes.md
          fi

      # ── create release on tag push ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: ${{ steps.meta.outputs.TAG }}
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
          files: ${{ steps.meta.outputs.ARTIFACT_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
