name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main, next]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python + dependencies (PyPI) ─────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install project + build tooling. Runtime deps are pinned in
          # pyproject.toml and pulled from PyPI; openlifu-sdk is then
          # replaced with the resolved GitHub release wheel below.
          pip install ".[dev]"

      # ── openlifu-sdk from GitHub releases ────────────────────────
      # SDK pre-releases are not published to PyPI, so resolve the tag
      # from the SDK repo's GitHub releases: rc tags and next-branch
      # builds take the latest pre-release (when it is at least as new
      # as the latest stable); everything else -- and rc/next builds
      # with no usable pre-release -- takes the latest stable release.
      - name: Resolve openlifu-sdk release
        id: sdk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REL=$(gh release list --repo OpenwaterHealth/openlifu-sdk \
                --json tagName,isPrerelease \
                --jq 'map(select(.isPrerelease | not)) | .[0].tagName // empty')
          PRE=$(gh release list --repo OpenwaterHealth/openlifu-sdk \
                --json tagName,isPrerelease \
                --jq 'map(select(.isPrerelease)) | .[0].tagName // empty')
          TAG="$REL"
          KIND="release"
          if [[ "${GITHUB_REF_NAME}" == "next" || "${GITHUB_REF_NAME}" =~ -rc\.[0-9]+$ ]]; then
            # semver compare: '-rc.' -> '~rc.' makes sort -V rank a pre-release
            # below its own stable release but above older ones.
            if [ -n "$PRE" ] && { [ -z "$REL" ] || \
                 [ "$(printf '%s\n' "${PRE/-rc./~rc.}" "$REL" | sort -V | tail -n1)" = "${PRE/-rc./~rc.}" ]; }; then
              TAG="$PRE"
              KIND="pre-release"
            fi
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No openlifu-sdk release found to install." >&2
            exit 1
          fi
          echo "SDK candidates: stable='${REL:-none}' pre-release='${PRE:-none}'"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice ::openlifu-sdk resolved to $KIND @ $TAG (ref ${GITHUB_REF_NAME})"

      - name: Install resolved openlifu-sdk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.sdk.outputs.tag }}" \
            --repo OpenwaterHealth/openlifu-sdk \
            --dir sdk-dist --pattern '*.whl'
          # Replace the PyPI-pinned SDK with the released wheel (the wheel
          # carries the firmware images bundled at SDK release time).
          pip uninstall -y openlifu-sdk
          pip install sdk-dist/*.whl
          python -c "from importlib.metadata import version; print('openlifu-sdk', version('openlifu-sdk'))"

      # ── build ────────────────────────────────────────────────────
      - name: Stamp version from git tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Strip leading 'v' only; -rc.x suffix is preserved as-is
            VER="${TAG#v}"
          else
            VER=$(git describe --tags --dirty --always --long 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "Stamping version: $VER"
          # Update _FALLBACK_VERSION in version.py so the frozen exe uses it
          sed -i "s/^_FALLBACK_VERSION = .*/_FALLBACK_VERSION = \"${VER}\"/" version.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller -y OpenLIFU-TestApp.spec

      # ── package ──────────────────────────────────────────────────
      - name: Determine version tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --dirty --always 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=OpenLifu-TestApp-${TAG}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_ZIP=OpenLifu-TestApp-${TAG}.zip" >> "$GITHUB_OUTPUT"

          # pre-release flag
          if [[ "$TAG" == *-rc.* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

          # code-signing flag (#49): only full (X.Y.Z) and release-candidate
          # (X.Y.Z-rc.N) tag builds are signed, whether pushed or dispatched
          # on the tag. Branch pushes and branch dispatches are dev builds
          # and stay unsigned. Every signing is metered, see docs/code-signing.md.
          if [[ "$GITHUB_REF" == refs/tags/* && "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "SIGN=true" >> "$GITHUB_OUTPUT"
            echo "::notice ::Release build: executables will be code-signed"
          else
            echo "SIGN=false" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice ::Version tag resolved to: ${TAG}"

      # ── code signing (rc + full release tags only, #49) ──────────
      # eSigner CKA (SSL.com's Cloud Key Adapter) loads Openwater's EV
      # code-signing cert into Cert:\CurrentUser\My; the private key never
      # leaves SSL.com's cloud HSM, signtool signs against the store
      # thumbprint. Same recipe as openmotion-bloodflow-app. Unlike there, a
      # release build without the eSigner secrets FAILS rather than shipping
      # unsigned.
      - name: Set up eSigner CKA (EV code signing)
        if: steps.meta.outputs.SIGN == 'true'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          if (-not $env:ES_USERNAME -or -not $env:ES_PASSWORD -or -not $env:ES_TOTP_SECRET) {
            Write-Host "::error::eSigner secrets (ES_USERNAME / ES_PASSWORD / ES_TOTP_SECRET) are not available to this repo; rc and full releases must be signed. See docs/code-signing.md."
            exit 1
          }
          $work = Join-Path $env:RUNNER_TEMP "esigner-cka"
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          Invoke-WebRequest -OutFile eSigner_CKA_Setup.zip "https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.8/SSL.COM-eSigner-CKA_1.0.8.zip"
          Expand-Archive -Force eSigner_CKA_Setup.zip
          Move-Item -Destination "eSigner_CKA_Installer.exe" -Path "eSigner_CKA_Setup\*.exe"
          $dir = Join-Path $env:USERPROFILE "eSignerCKA"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Start-Process ".\eSigner_CKA_Installer.exe" -ArgumentList "/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR=`"$dir`"" -Wait
          # Post-install helpers from SSL.com's reference workflow; guarded
          # because not every CKA build ships them.
          foreach ($aux in @("$dir\RegisterKSP.exe", "$dir\eSignerCSP.Config.exe")) {
            if (Test-Path $aux) { & $aux | Out-Null }
          }
          & "$dir\eSignerCKATool.exe" config -mode product -user $env:ES_USERNAME -pass $env:ES_PASSWORD -totp $env:ES_TOTP_SECRET -key "$dir\master.key" -r
          & "$dir\eSignerCKATool.exe" unload
          & "$dir\eSignerCKATool.exe" load
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          if (-not $cert) { throw "eSigner CKA loaded no code-signing certificate" }
          Write-Host "Signing as: $($cert.Subject)  [$($cert.Thumbprint)]"
          "CODESIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # Signs (and verifies) every exe at the top of the bundle --
      # TestApp.exe and TestApp_console.exe, 2 metered signings. The Qt /
      # Python DLLs under _internal are third-party and stay as shipped.
      - name: Sign executables
        if: steps.meta.outputs.SIGN == 'true'
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem dist\TestApp -Filter *.exe | ForEach-Object FullName)
          if ($exes.Count -eq 0) { throw "no executables found in dist\TestApp" }
          .\scripts\sign.ps1 -Files $exes

      # signtool appends the signature to each exe, so prove the frozen app
      # still boots from it: --help exits before any hardware or window is
      # touched. Runs on every build, so dev builds exercise it first.
      - name: Smoke-test the frozen app
        shell: pwsh
        timeout-minutes: 3
        run: |
          & dist\TestApp\TestApp_console.exe --help
          if ($LASTEXITCODE -ne 0) { throw "TestApp_console.exe --help exited $LASTEXITCODE" }

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "${{ steps.meta.outputs.ARTIFACT_ZIP }}"

      # ── always upload workflow artifact ──────────────────────────
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
          path: ${{ steps.meta.outputs.ARTIFACT_ZIP }}

      # ── build release notes ───────────────────────────────────────
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        run: |
          : > notes.md

          if [[ "${{ steps.meta.outputs.PRERELEASE }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          # Commits since previous tag (bullet list)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since ${PREV_TAG}" >> notes.md
            echo "" >> notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> notes.md
            echo "" >> notes.md
            echo "" >> notes.md
            echo "**Full diff:** [\`${PREV_TAG}...${{ steps.meta.outputs.TAG }}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.meta.outputs.TAG }})" >> notes.md
          else
            echo "### Commits" >> notes.md
            echo "" >> notes.md
            git log --pretty=format:"- %s (%h)" -20 >> notes.md
          fi

      # ── create release on tag push ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: ${{ steps.meta.outputs.TAG }}
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
          files: ${{ steps.meta.outputs.ARTIFACT_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
